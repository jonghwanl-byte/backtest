name: KRW Study

# 수동 실행 전용. 스케줄 없음 — 1회성 측정이지 운영 봇이 아니다.
on:
  workflow_dispatch:
    inputs:
      fx_source:
        description: "환율 데이터 소스"
        type: choice
        options: [fred, yfinance]
        default: fred
      start:
        description: "시작일 YYYY-MM-DD (비우면 전체 이력)"
        type: string
        default: ""
      apply_tax:
        description: "양도소득세 적용 (연금계좌는 false. 게이트 확인 시 false)"
        type: boolean
        default: false
      cash_ccy:
        description: "현금 보유 통화 (usd = 달러 단기채, 실제 운용 방식)"
        type: choice
        options: [usd, krw]
        default: usd
      krw_rate_source:
        description: "원화 현금 금리 (fred = 실제 시계열, flat = 고정)"
        type: choice
        options: [fred, flat]
        default: fred
      krw_cash_rate:
        description: "krw_rate_source=flat 일 때만 사용하는 고정 연이율"
        type: string
        default: "0.02"

jobs:
  study:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "yfinance==0.2.65" "pandas<3" "numpy<3"
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run KRW study
        env:
          FX_SOURCE:     ${{ inputs.fx_source }}
          START:         ${{ inputs.start }}
          KRW_CASH_RATE: ${{ inputs.krw_cash_rate }}
          KRW_DEDUCTION: "2500000"
          APPLY_TAX:     ${{ inputs.apply_tax }}
          CASH_CCY:      ${{ inputs.cash_ccy }}
          KRW_RATE_SOURCE: ${{ inputs.krw_rate_source }}
        run: python krw_study.py

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: krw-study-results
          path: |
            krw_summary.csv
            krw_subperiods.csv
            krw_returns.csv
            krw_equity.csv
          if-no-files-found: warn
          retention-days: 30
